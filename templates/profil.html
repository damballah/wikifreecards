<!DOCTYPE html>
<html lang="fr" data-theme="$theme_site" data-accent="$accent_mode" data-survol="$effet_survol" data-anim-zoom="$anim_zoom">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Profil · $titre_page</title>
  <style id="styles-cartes">
$css
  </style>
</head>
<body style="--largeur-carte: ${largeur_carte}px; --largeur-apercu: ${largeur_apercu}px; $style_halo" data-halo="0"
        data-largeur-export="$largeur_export" data-impression="$impression" data-jeton="$jeton"
        data-page="profil" data-par-page="24" data-export-categories="$export_categories">
  <main class="page page--profil">
    <header class="entete" style="$style_entete">
      <div class="entete__haut">
        <div class="entete__marque">
          $logo_entete
          $photo_profil
          <div class="entete__titre">
            <h1>$titre_site</h1>
            $bio
            <p class="entete__infos" id="infos-profil">$infos</p>
          </div>
        </div>
        $actions
      </div>
    </header>

$bilan

    <section class="vitrines" id="vitrines" lang="$langue" aria-label="Vitrines">
$vitrines
    </section>
  </main>

  <div class="selecteur" id="selecteur" role="dialog" aria-modal="true" aria-labelledby="selecteur-titre" hidden>
    <div class="selecteur__fenetre">
      <header class="selecteur__haut">
        <h2 id="selecteur-titre">Choisir une carte</h2>
        <button type="button" class="selecteur__fermer" id="selecteur-fermer" aria-label="Fermer">×</button>
      </header>
      <div class="selecteur__recherche">
        <label for="selecteur-recherche" class="sr-only">Rechercher une carte par son titre, son sous-titre ou sa description</label>
        <input type="search" id="selecteur-recherche" maxlength="100" placeholder="Rechercher (titre, sous-titre, description)…" title="La recherche porte sur le titre, le sous-titre et la description des cartes" autocomplete="off" spellcheck="false">
      </div>
      <div class="selecteur__filtres">
        $rangs_selecteur
        $tris_selecteur
      </div>
      <p class="selecteur__etat" id="selecteur-etat" role="status" aria-live="polite"></p>
      <ul class="selecteur__liste" id="selecteur-liste"></ul>
      <footer class="selecteur__bas">
        <button type="button" class="bouton-site" id="selecteur-plus" hidden>Afficher plus de cartes</button>
      </footer>
    </div>
  </div>
$pied_page

  <script>
$js
  </script>
</body>
</html>
