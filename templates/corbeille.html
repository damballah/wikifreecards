<!DOCTYPE html>
<html lang="fr" data-theme="$theme_site" data-accent="$accent_mode" data-survol="$effet_survol" data-anim-zoom="$anim_zoom">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Corbeille</title>
  <style id="styles-cartes">
$css
  </style>
</head>
<body class="mode-selection" style="--largeur-carte: ${largeur_carte}px; --largeur-apercu: ${largeur_apercu}px" data-jeton="$jeton" data-page="$page">
  <main class="page page--corbeille">
    <header class="entete entete--config" style="$style_entete">
      <div class="entete__haut">
        <div class="entete__marque">
          $logo_entete
          <div class="entete__titre">
            <h1>Corbeille</h1>
            <p class="entete__infos" id="corbeille-page-intro">$intro Coche des cartes pour les restaurer ou les supprimer définitivement ; les autres restent dans la corbeille.</p>
          </div>
        </div>
        $actions
      </div>
    </header>

    <p class="vide" id="corbeille-page-vide" role="status" $masque_vide>La corbeille est vide. <a href="/">Retour à la collection</a></p>

    <div id="corbeille-contenu" $masque_contenu>
      <div class="barre-selection" id="barre-corbeille" role="region" aria-label="Actions sur les cartes de la corbeille">
        <span class="barre-selection__compte" id="corbeille-compte" role="status">Aucune carte sélectionnée</span>
        <button type="button" class="bouton-site" id="corbeille-tout">Tout sélectionner</button>
        <button type="button" class="bouton-site bouton-site--principal" id="corbeille-restaurer-selection" disabled>Restaurer la sélection</button>
        <button type="button" class="corbeille__supprimer" id="corbeille-supprimer-selection" disabled>Supprimer définitivement la sélection</button>
      </div>
      <p class="recherche__etat" id="corbeille-page-etat" role="status" aria-live="polite"></p>
      <div class="pagination-zone" id="pagination-haut">$pagination</div>
      <section class="grille grille--corbeille" id="corbeille-grille" lang="$langue" aria-label="Cartes de la corbeille">
$cartes
      </section>
      <div class="pagination-zone" id="pagination-bas">$pagination</div>
    </div>
  </main>
$pied_page

  <script>
$js
  </script>
</body>
</html>
