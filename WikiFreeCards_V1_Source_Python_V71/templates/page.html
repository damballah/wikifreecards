<!DOCTYPE html>
<html lang="fr" data-theme="$theme_site" data-accent="$accent_mode" data-survol="$effet_survol" data-anim-zoom="$anim_zoom">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>$titre_page</title>
  <style id="styles-cartes">
$css
  </style>
</head>
<body style="--largeur-carte: ${largeur_carte}px; --largeur-apercu: ${largeur_apercu}px; $style_halo" data-halo="$halo"
        data-largeur-export="$largeur_export" data-impression="$impression" data-jeton="$jeton"
        data-page="$page" data-par-page="$par_page" data-export-categories="$export_categories" data-mode="$mode_page">
  <main class="page $classe_page">
    <header class="entete" style="$style_entete">
      <div class="entete__haut">
        <div class="entete__marque">
          $logo_entete
          <div class="entete__titre">
            <h1>$titre_site</h1>
            $bio
            <p class="entete__infos" id="infos-collection">$infos</p>
          </div>
        </div>
        $actions
      </div>
      <ul class="resume" aria-label="Filtrer la collection par rareté">
$resume
      </ul>
      <input type="checkbox" id="barre-bascule" class="menu-bascule__case" aria-controls="barre-outils">
      <div class="barre-bascule-zone"><label for="barre-bascule" class="bouton-site barre-bascule" title="Afficher ou masquer les filtres, le tri et la taille des cartes"><span aria-hidden="true">☰</span> Filtres, tri et taille</label></div>
      <div class="barre-outils" id="barre-outils">
        <div class="recherche-collection" role="search">
          <label for="recherche-collection" class="sr-only">Rechercher une carte par son titre</label>
          <input type="search" id="recherche-collection" value="$recherche" maxlength="100"
                 placeholder="Rechercher une carte…" autocomplete="off" spellcheck="false"
                 title="Cherche dans le titre des cartes (plusieurs mots possibles ; accents et majuscules ignorés)">
          <button type="button" id="recherche-effacer" class="recherche-collection__effacer" aria-label="Effacer la recherche" title="Effacer la recherche"$recherche_effacer_masque>×</button>
        </div>
        $filtre_categorie
        $tri
        <button type="button" class="bouton-site" id="bouton-selection" aria-pressed="false" title="Afficher des cases à cocher sur les cartes pour les classer dans des catégories">☑ Sélection</button>
        <div class="reglages">
          <label for="taille-cartes">Taille des cartes</label>
          <input id="taille-cartes" type="range" min="140" max="400" step="10" value="$largeur_carte">
          <output id="taille-valeur" for="taille-cartes">$largeur_carte px</output>
          <button type="button" id="taille-reinitialiser" class="reglages__reinit" title="Revenir à la taille définie dans la configuration" aria-label="Réinitialiser la taille des cartes">↺</button>
        </div>
      </div>
    </header>

    $zone_paquet

$panneau_selection

    <p class="vide" id="collection-vide" $vide_masque>$vide_texte</p>
    <p class="vide" id="aucun-resultat" $aucun_masque>Aucune carte ne correspond à ces filtres.</p>

    <div class="pagination-zone" id="pagination-haut">$pagination</div>
    <section class="grille" id="grille" lang="$langue" aria-label="Collection de cartes">
$cartes
    </section>
    <div class="pagination-zone" id="pagination-bas">$pagination</div>
  </main>
$pied_page

$donnees_demo
  <script>
$js
  </script>
</body>
</html>
