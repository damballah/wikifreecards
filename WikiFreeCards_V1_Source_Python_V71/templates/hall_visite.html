<!DOCTYPE html>
<html lang="fr" data-theme="$theme_site" data-accent="$accent_mode" data-survol="$effet_survol" data-anim-zoom="$anim_zoom">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>$titre_onglet</title>
  <style id="styles-cartes">
$css
  </style>
  <style id="style-apparence"></style>
</head>
<body class="$classe_corps" style="--largeur-carte: ${largeur_carte}px; --largeur-apercu: ${largeur_apercu}px" data-jeton="$jeton" data-page="hall-visite" data-pair="$pair" data-mode="$mode" data-par-page="$par_page">
  <main class="page page--hall page--visite page--$mode">
    <header class="entete" style="$style_entete">
      <div class="entete__haut">
        <div class="entete__marque">
          $logo_entete
          <div class="entete__titre">
            <h1 id="visite-titre">$titre_collection</h1>
            <p class="entete__bio" id="visite-bio"></p>
            <p class="entete__infos">Collectionneur : <strong id="visite-pseudo">$pseudo</strong> <span class="hall__lecture-seule">Lecture seule</span></p>
          </div>
        </div>
        <nav class="actions-site" aria-label="Navigation du Hall">
          <a class="bouton-site" id="visite-autre" href="$lien_autre">$libelle_autre</a>
          <a class="bouton-site" id="visite-quitter" href="/hall">Quitter</a>
        </nav>
      </div>
    </header>

    <p class="recherche__etat" id="visite-etat" role="status" aria-live="polite">Chargement depuis le collectionneur…</p>
    <div id="visite-bilan"></div>
$corps
  </main>
$pied_page

  <script>
$js
  </script>
</body>
</html>
